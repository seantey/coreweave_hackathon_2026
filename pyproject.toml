[project]
name = "clean-room-imputation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "pillow>=11,<13",
    "weave>=0.52,<1",
    "playwright>=1.58,<2",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
